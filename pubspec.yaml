name: yogolyzer
description: "汚れを撮影→AI診断→洗剤・掃除方法を提案するアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Local Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1

  # Camera
  camera: ^0.11.1
  image_picker: ^1.1.2

  # Subscription
  purchases_flutter: ^8.10.10

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  shared_preferences: ^2.5.0
  connectivity_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
