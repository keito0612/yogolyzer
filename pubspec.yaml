name: yogolyzer
description: "汚れを撮影→AI診断→洗剤・掃除方法を提案するアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  flutter_svg: ^2.0.16
  shimmer: ^4.0.0

  # State Management
  flutter_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

  # Local Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Camera
  camera: ^0.12.0+2
  image_picker: ^1.1.2

  # Subscription
  purchases_flutter: ^10.10.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  shared_preferences: ^2.5.0
  connectivity_plus: any
  freezed_annotation: ^3.1.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: any
  drift_dev: any

  # Testing
  mocktail: ^1.0.4
  freezed: ^4.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
